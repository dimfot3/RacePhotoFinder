dataset: ../datasets/person_cropped_images
model: medium
pretrained: ../person_detection/weights/rf-detr-medium.pth
weights: runs/bib_rfdetr_medium/checkpoint_best_total.pth
# Detection thresholds. Re-tune from evaluation_stats.json after training.
confidence: 0.49
fallback_confidence: 0.05
fallback_ocr_confidence: 0.95
max_candidates_per_person: 5
batch: 8
device: cuda
precision: fp16
train:
  output_dir: runs/bib_rfdetr_medium
  epochs: 50
  batch_size: 4
  grad_accum_steps: 4
  num_workers: 4
  early_stopping: true
  early_stopping_patience: 10
  tensorboard: false
